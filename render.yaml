services:
  - type: worker
    name: solana-wallet-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SOLANA_RPC_ENDPOINT
        value: https://api.mainnet-beta.solana.com
